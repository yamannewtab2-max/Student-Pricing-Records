kind = "web"
previewPath = "/"
title = "Student Pricing Records"
description = "A focused workspace for creating student pricing records, selecting students, assigning prices, reviewing totals, and keeping saved records available after refresh."
version = "1.0.0"
id = "artifacts/student-pricing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22915

[services.development]
run = "pnpm --filter @workspace/student-pricing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/student-pricing", "run", "build" ]
serve = "static"
publicDir = "artifacts/student-pricing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22915"
BASE_PATH = "/"
